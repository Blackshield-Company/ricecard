[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ricecard"
version = "0.1.0"
description = "Turn a desktop screenshot and an Omarchy theme into ready-to-post showcase images."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "synthalorian" }]
requires-python = ">=3.8"
dependencies = ["Pillow>=9.1"]
keywords = ["omarchy", "hyprland", "rice", "theme", "screenshot", "showcase"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
  "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ricecard = "ricecard:main"

[tool.setuptools]
py-modules = ["ricecard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
